<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Halo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="screen"></canvas>
<canvas id="canvas" tabindex="-1"></canvas>
<form id="entry" class="hidden" autocomplete="off">
  <label for="entry-text">Type your name</label>
  <input id="entry-text" type="text" spellcheck="false" autocapitalize="off" enterkeyhint="done">
  <div id="entry-hint">Enter to confirm · Esc to cancel</div>
</form>
<div id="status" role="status">
  <div id="status-text">Loading…</div>
  <div id="status-detail"></div>
</div>
<script src="site-config.js"></script>
<script src="net.js"></script>
<script src="page.js"></script>
</body>
</html>
