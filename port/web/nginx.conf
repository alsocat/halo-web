# Halo in the browser (port/web): the site that port/web/deploy.sh copies, the
# server's maps (read in HTTP ranges; maps/index.json lists them) and the
# broker the players' pages find each other through (mosquitto, MQTT over
# WebSockets on 127.0.0.1:9001). Refer to port/web/README.md.
server {
	listen 8080;
	root /srv/halo/site;
	index index.html;

	# the game uses threads (SharedArrayBuffer), which need cross-origin isolation
	add_header Cross-Origin-Opener-Policy "same-origin" always;
	add_header Cross-Origin-Embedder-Policy "require-corp" always;
	add_header Cross-Origin-Resource-Policy "same-origin" always;
	add_header Cache-Control "no-cache" always;

	types {
		text/html html;
		text/css css;
		text/javascript js;
		application/wasm wasm;
		application/json json;
		application/octet-stream map;
	}

	location /maps/ {
		alias /srv/halo/maps/;
	}

	location = /mqtt {
		proxy_pass http://127.0.0.1:9001;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_read_timeout 1h;
	}
}
